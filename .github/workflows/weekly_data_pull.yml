name: Weekly data pull

on:
  schedule:
    # 13:00 UTC = 7am America/Denver during MDT (Mar-Nov). Shifts to 6am local
    # during MST (Nov-Mar) since GitHub cron is fixed UTC and doesn't track DST.
    # EXTENDED TEST WINDOW, still not the standing cadence: switched from Tue/Fri/Sat
    # to daily on 2026-09-01/02 to stress-test that week's fixes (the git-add crash
    # and the Open-Meteo timeout/circuit-breaker); user extended the daily window on
    # 2026-09-03 to roughly 8-10 more days (~through 2026-09-11 to 09-13) rather than
    # reverting on the original 09-07 date -- explicitly not a permanent decision yet.
    # Revert to "0 13 * * 2,5,6" (Tue/Fri/Sat) around then unless extended again.
    # (Odds API budget isn't the constraint either way -- daily is well inside the
    # free tier: 3 credits/pull * 365/yr ~= 1,095/yr vs. the tier's 6,000/yr.)
    - cron: "0 13 * * *"  # daily (extended test window, see above)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  pull-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest season data (games, teams, coaches, lines)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/backfill.py 2026 2026

      - name: Pull latest player stats and rosters
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/backfill_players.py 2026 2026

      - name: Pull latest team box score stats
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/backfill_team_game_stats.py 2026 2026

      - name: Pull live odds
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/pull_odds.py

      - name: Scrape current injuries (best-effort, no key needed)
        run: python scripts/scrape_injuries.py

      - name: Pull forecast weather for upcoming games (no key needed)
        run: python scripts/pull_weather_forecast.py

      - name: Pull Polymarket win probabilities (no key needed, accuracy-check only)
        run: python scripts/pull_polymarket.py

      - name: Archive and prune stale odds/injury snapshots
        run: python scripts/prune_live_data.py

      - name: Commit and push refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cfb.db
          # These only get created the first time prune_live_data.py actually finds
          # stale rows to archive -- `git add` on a literal missing filename is a
          # fatal error (unlike a glob), so guard each one instead of adding blindly.
          if [ -f data/live_odds_archive.csv ]; then git add data/live_odds_archive.csv; fi
          if [ -f data/injuries_archive.csv ]; then git add data/injuries_archive.csv; fi
          git diff --cached --quiet && echo "No data changes" && exit 0
          git commit -m "Weekly data pull: $(date -u +%Y-%m-%d)"
          git push

      # Doesn't depend on the account's own notification settings being configured
      # right (can't verify those via API) -- a GitHub Issue is visible on the repo
      # itself regardless. De-dupes into one running issue instead of a fresh one
      # per failed day, in case something breaks and stays broken for a few runs.
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          existing=$(gh issue list --repo "${{ github.repository }}" --state open \
            --search "Weekly data pull failed in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "Failed again: $run_url"
          else
            gh issue create --repo "${{ github.repository }}" --title "Weekly data pull failed" \
              --body "The scheduled data-pull workflow failed. Run: $run_url"
          fi
