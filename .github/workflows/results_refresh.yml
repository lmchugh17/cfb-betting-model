name: Results refresh

# Separate from weekly_data_pull.yml on purpose: this is JUST a scores refresh
# (fresh scores + rebuilt site), not the full daily pipeline. Deliberately does NOT
# touch odds/weather/injuries/predictions/explanations/AP-rankings -- no Claude
# routine involved, no CFBD calls beyond the 2 needed for scores (weekly_data_pull.yml
# already refreshes those on its own Thu-Mon cadence).
#
# REWRITTEN 2026-09-10 after a real incident: the previous version used a hand-picked
# list of day-specific checkpoints (Thu/Fri/Sat/Sun only), reasoning "CFB has no
# regular Monday slate." That assumption was false -- Florida State @ SMU played
# Monday 2026-09-07 and sat with no score on the site for 3 days, since
# weekly_data_pull.yml's own Thu-Mon cadence also skips Tue/Wed, so nothing caught it
# until the following Thursday. Replaced with a uniform every-4h-every-day schedule
# using scripts/refresh_scores_only.py (2 CFBD calls/run) so no day could ever drop
# to zero coverage again.
#
# TAPERED BY DAY OF WEEK 2026-09-11, per user request, after the uniform version felt
# too frequent. Measured the actual 2026 schedule (data/cfb.db, `games` table) rather
# than guess -- real game counts by day of week: Sat 719, Sun 71, Fri 45, Wed 24,
# Thu 22, Tue 6, Mon 1. Two tiers, NEVER zero checkpoints on any day -- collapsing a
# light day back to zero is exactly what caused the Monday incident above:
#   - Heavy (Fri/Sat/Sun, the 835 games that are 94% of the season): 4 checkpoints
#     each, spanning real CFB broadcast windows (noon/early-afternoon/primetime/
#     West-Coast-late), reused from this workflow's own pre-rewrite design since that
#     spacing was already validated against actual kickoff-time clustering.
#   - Light (Mon/Tue/Wed/Thu, the 53 games that are 6% of the season): 2 checkpoints
#     each. Checked real kickoff-hour clustering for these 4 days specifically (all
#     UTC, all 2026) rather than assume evening timing: Mon 23:00(1), Tue 05:00(1)/
#     23:00(5), Wed 00:00(12)/05:00(8)/23:00(4), Thu 00:00(3)/22:00(1)/23:00(18) --
#     every single one clusters at ~7-8pm ET (the 23:00/00:00 UTC block) or a later
#     ~1am ET window (05:00 UTC), so one checkpoint per window is enough; no light
#     day has any morning/afternoon games to also cover.
# Net effect: ~40 calls/week (~160-175/month in-season) instead of the uniform
# version's ~84 calls/week (~360/month) -- roughly half the API usage, while Saturday
# actually keeps denser, broadcast-window-targeted coverage than a blind /4 stepping
# gave it, and the true noise days (Tue/Mon) drop from 6 checks/day to 2 instead of
# vanishing entirely.
#
# RE-TIMED 2026-09-30 off measured game END times plus measured scheduler delay, not
# kickoff clustering. End times: ESPN play-by-play last-play wallclock, 2026 weeks 1-4,
# 325 games -- median length 3h26m, p90 3h59m. p90 end time (ET) by window: Sat noon
# 4:30pm, Sat afternoon 8:23pm, Sat evening 11:26pm, Sat late 2:27am, Thu/Fri evening
# 11:36pm-12:14am. Scheduler delay: a 1-week probe (2026-09-21..27, 303/303 slots ran)
# measured median start delay by UTC hour -- ~3.1h at 18 UTC, ~2.3h at 22 UTC, ~4.7h at
# 00 UTC, ~5.4h at 02 UTC. So each cron below is set to where its run actually LANDS,
# shortly after a window's p90 end (EDT):
#   18:13 UTC -> lands ~5:20pm   (Sat noon window)
#   22:43 UTC -> lands ~9:00pm   (Sat afternoon window)
#   00:13 UTC -> lands ~12:55am  (evening windows, every night -- Sat evening is the
#                                 biggest window and previously waited until ~4am)
#   02:13 UTC -> lands ~3:35am   (late/West-Coast window, every night)
# No slot can land between ~10pm and ~12:50am EDT: anything scheduled at 23 UTC lands
# ~1:30-2am UTC, and the delay jumps to ~4.7h at 00 UTC. Same 20 runs/week as the
# 09-11 tapered design; light days (Mon-Thu) keep their 2 nightly checkpoints.
# Fri/Sat/Sun get the 2 extra daytime ones.
#
# DST: GitHub cron is fixed UTC, so every slot is listed twice -- EDT months (8-10) and
# EST months (11-12,1) one hour later -- so ET landing times hold across the 2026-11-01
# switch. Open question: whether the delay curve tracks UTC or US-local load; re-check
# run start times after the first EST weekend (2026-11-07/08).
# A UTC day-of-week that differs from the ET day (the 00:13/02:13 runs cover the PREVIOUS
# ET evening) is correct, not a bug.
#
# Minute offset to :13/:43, never :00/:30 -- GitHub Actions explicitly documents that
# scheduled workflows can be delayed or dropped during high-load periods, and "high
# load" specifically means the top (and half) of every hour, since most repos on
# GitHub default their crons there. Confirmed for real on the NFL sibling project the
# day its own every-2h version went live: only 2 of ~8 expected fires in a 16h window
# actually ran.
#
# Season-scoped (Aug-Jan) since 2026-09-10 -- no need to poll year-round when there's
# nothing to refresh. Cron's month field doesn't wrap a range across the year
# boundary, so it's listed as two pieces, "8-12,1" -- same 6 months either way.
on:
  schedule:
    # EDT (Aug-Oct): daytime checkpoints, Fri/Sat/Sun only (UTC day = ET day)
    - cron: "13 18 * 8-10 0,5,6"
    - cron: "43 22 * 8-10 0,5,6"
    # EDT: nightly checkpoints, every day (cover the previous ET evening/late games)
    - cron: "13 0 * 8-10 *"
    - cron: "13 2 * 8-10 *"
    # EST (Nov-Jan): same ET landing times, one hour later in UTC
    - cron: "13 19 * 11-12,1 0,5,6"
    - cron: "43 23 * 11-12,1 0,5,6"
    - cron: "13 1 * 11-12,1 *"
    - cron: "13 3 * 11-12,1 *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # See weekly_data_pull.yml: caches pip's wheel downloads, keyed on requirements.txt.
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current-season scores (lean, 2 CFBD calls)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/refresh_scores_only.py 2026

      # CFBD's finals can lag hours behind the game (2026-09-19: Florida State @ Alabama was
      # Final on ESPN while CFBD still had no score 5.5h after kickoff). This fills only the
      # gaps CFBD hasn't posted yet and never overwrites a score with NULL. Best-effort: ESPN's
      # site API is undocumented and free APIs do block GitHub Actions IP ranges, so a failure
      # here must not fail the refresh -- CFBD's own pass already ran above.
      - name: Fill in finals ESPN already has (best-effort)
        continue-on-error: true
        timeout-minutes: 3
        run: python scripts/refresh_scores_espn.py 2026

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit and push if scores changed
        # Retries on push rejection: this can genuinely collide with
        # weekly_data_pull.yml's own push (that job takes ~11 minutes, a wide
        # collision window) -- confirmed for real on the NFL sibling project
        # 2026-09-11 (same shape, a run's fresh commit silently dropped on a bare
        # `git push`). Rebase-and-retry instead of failing once.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Don't commit the 32MB data/cfb.db here. This job ran ~105 times in 30 days and each
          # commit stores another near-full copy of the binary (repo: 296MB working, 124MB packed).
          # Scores are cheap to re-fetch every run (ESPN is free, CFBD's 2 calls are spent anyway)
          # and weekly_data_pull.yml still commits the DB daily, so nothing is lost but the churn.
          git checkout -- data/cfb.db
          # The page embeds its own "Generated ..." timestamp, so it differs on every build even
          # when no score did. Only commit when something other than that line changed -- a no-op
          # push would still trigger a Pages deploy (140 of those in 30 days).
          if ! git diff -- docs/index.html | grep '^[+-]' | grep -v '^\(+++\|---\)' | grep -qv 'Generated '; then
            echo "Only the generated-at timestamp changed -- nothing to publish"
            git checkout -- docs/index.html
            exit 0
          fi
          git add docs/index.html
          git diff --cached --quiet && echo "No site changes" && exit 0
          git commit -m "Results refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt) -- another workflow pushed in the meantime, rebasing and retrying..."
            git fetch origin master
            git rebase origin/master
            sleep $((RANDOM % 8 + 2))
          done
          echo "::error::Push failed after 5 attempts."
          exit 1
