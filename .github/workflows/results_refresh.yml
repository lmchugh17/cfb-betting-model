name: Results refresh

# Separate from weekly_data_pull.yml on purpose: this is JUST a scores refresh
# (fresh scores + rebuilt site), not the full daily pipeline. Deliberately does NOT
# touch odds/weather/injuries/predictions/explanations/AP-rankings -- no Claude
# routine involved, no CFBD calls beyond the 2 needed for scores (weekly_data_pull.yml
# already refreshes those on its own Thu-Mon cadence).
#
# REWRITTEN 2026-09-10 after a real incident: the previous version used a hand-picked
# list of day-specific checkpoints (Thu/Fri/Sat/Sun only), reasoning "CFB has no
# regular Monday slate." That assumption was false -- Florida State @ SMU played
# Monday 2026-09-07 and sat with no score on the site for 3 days, since
# weekly_data_pull.yml's own Thu-Mon cadence also skips Tue/Wed, so nothing caught it
# until the following Thursday. The real distribution (checked against 2026's actual
# schedule): CFB has games on literally every day of the week, just concentrated on
# Sat >> Fri/Sun > Wed/Thu > Tue/Mon. A day-of-week allowlist is the wrong shape for
# this -- runs every day instead now, no exceptions.
#
# Uses scripts/refresh_scores_only.py (2 CFBD calls/run: games() regular+postseason,
# updates only already-known game ids) instead of backfill.py (~7 calls/run) --
# CFBD's free tier is 1,000 calls/month shared with weekly_data_pull.yml's own
# (growing-through-the-season) usage, so a frequent job needs the leanest possible
# call footprint. At every 4 hours this is 6 runs/day * 2 calls = ~360/month --
# combined with weekly_data_pull.yml's own usage (~220-560/month depending on how
# many weeks of team-game-stats exist so far), comfortably under the cap even at
# late-season peak. Worst-case staleness is now a uniform <=4h every single day,
# down from what was, in practice, up to 3 days on an uncovered day.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Refresh current-season scores (lean, 2 CFBD calls)
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: python scripts/refresh_scores_only.py 2026

      - name: Rebuild site
        run: python scripts/build_site.py

      - name: Commit and push if scores changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cfb.db docs/index.html
          git diff --cached --quiet && echo "No score changes" && exit 0
          git commit -m "Results refresh: $(date -u +%Y-%m-%dT%H:%M)Z"
          git push
